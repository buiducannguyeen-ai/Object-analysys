<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress expected benign Vite WebSocket HMR notices in AI Studio preview environment
      (function () {
        window.addEventListener('unhandledrejection', function (event) {
          if (
            event &&
            event.reason &&
            (String(event.reason.message || event.reason).includes('WebSocket closed without opened') ||
             String(event.reason.message || event.reason).includes('failed to connect to websocket'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        const origConsoleError = console.error;
        console.error = function (...args) {
          const firstArg = args[0] != null ? String(args[0]) : '';
          if (
            firstArg.includes('[vite] failed to connect to websocket') ||
            firstArg.includes('WebSocket closed without opened')
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhận Diện Đồ Vật Webcam AI</title>
    <meta name="description" content="Ứng dụng nhận diện đồ vật qua webcam và video theo thời gian thực sử dụng trí tuệ nhân tạo Gemini Vision." />
    <meta property="og:title" content="Nhận Diện Đồ Vật Webcam AI" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
</html>
